<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Surprise ❤️</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="surprise.css">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- Back Button -->
    <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Home
    </a>

    <!-- ================= GIFT ================= -->

    <section id="giftSection">

        <div class="gift-box">
            🎁
        </div>

        <h1>A Surprise For You ❤️</h1>

        <p>Click the gift to open it.</p>

    </section>

    <!-- ================= OPEN WHEN ================= -->

    <section id="openWhenSection">

        <h1>💌 Open When...</h1>

        <div class="open-grid">

            <!-- Sad -->
            <div class="open-card"
                data-title="💌 Open when you're sad"
                data-message="Whenever you're feeling sad, remember that I'm always here for you. Even if I'm not beside you, my heart is always with you. ❤️">

                <div class="envelope">
                    <div class="envelope-top"></div>
                    <div class="envelope-body"></div>
                    <div class="heart-seal">❤️</div>
                </div>

                <span>Open when you're sad</span>

            </div>

            <!-- Miss Me -->
            <div class="open-card"
                data-title="🥺 Open when you miss me"
                data-message="Close your eyes and imagine I'm holding your hand. We'll see each other soon. ❤️">

                <div class="envelope">
                    <div class="envelope-top"></div>
                    <div class="envelope-body"></div>
                    <div class="heart-seal">❤️</div>
                </div>

                <span>Open when you miss me</span>

            </div>

            <!-- Happy -->
            <div class="open-card"
                data-title="😊 Open when you're happy"
                data-message="Your smile is my favorite thing in the world. Keep smiling because it brightens my day too. ❤️">

                <div class="envelope">
                    <div class="envelope-top"></div>
                    <div class="envelope-body"></div>
                    <div class="heart-seal">❤️</div>
                </div>

                <span>Open when you're happy</span>

            </div>

            <!-- Can't Sleep -->
            <div class="open-card"
                data-title="😴 Open when you can't sleep"
                data-message="Sleep peacefully, my love. Tomorrow is another beautiful day for us. Sweet dreams. ❤️">

                <div class="envelope">
                    <div class="envelope-top"></div>
                    <div class="envelope-body"></div>
                    <div class="heart-seal">❤️</div>
                </div>

                <span>Open when you can't sleep</span>

            </div>
<!-- Tired -->
<div class="open-card"
    data-title="🥺 Open when you're tired"
    data-message="My love, I know you've been working so hard, and I'm so proud of you. Please don't forget to rest because your health and happiness mean everything to me.">

    <div class="envelope">
        <div class="envelope-top"></div>
        <div class="envelope-body"></div>
        <div class="heart-seal">❤️</div>
    </div>

    <span>Open when you're tired</span>

</div>

        </div>

    </section>

    <!-- ================= LETTER VIEWER ================= -->

    <div id="letterViewer">

        <div class="letter-envelope">

            <div class="letter-flap"></div>

            <div class="letter-base"></div>

            <div class="letter-paper">

                <button id="closeLetter">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <h2 id="letterTitle"></h2>

                <p id="letterMessage"></p>

            </div>

        </div>

    </div>

    <script src="surprise.js"></script>

</body>
</html>
